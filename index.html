<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css"/>
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <script defer src="main.js"></script>
        <title>FATE</title>
        <link rel="icon" type="image/x-icon" href="Icon.ico">
    </head>
    <body>
        <div id="container">
            <div>
                <div id="guessBarDiv">
                    <input id="guessBar" type="search" placeholder="Figured it out?">
                </div>
                <div id="submitButtonDiv">
                    <button id="timer-button" class="myButtons" onclick="handleTimerButton()">Start</button>
                    <button id="submitButton" class="myButtons" onclick="sendGuess()">Send it!</button>
                </div>
                <div id="imageHolder"/>
            </div>
        </div>
    </body>
</html>
