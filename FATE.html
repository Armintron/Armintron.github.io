<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css"/>
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <script defer src="main.js"></script>
        <title>FATE</title>
        <link rel="icon" type="image/x-icon" href="Icon.ico">

    <body>
        <a href="index.html" style="font-size: 50px;">Home</a> <!--home page link-->
        <div id="container">
            <div>
                <div id="guessBarDiv">
                    <input id="guessBar" type="search" placeholder="Figured it out?">

                    <button id="submitButton" class="myButtons" onclick="sendGuess()">Send it!</button>

                <div id="imageHolder"></div>
                <div class="centeredDiv" id="camera-box" style="display:none">
                    <div class="photoTaker">
                        <video id="video" style="width:800px">
                    </div>
                    <button id="start-button" class="myButtons" style="margin-top: 679px">Take Picture!</button>
                </div>
            </div>
        </div>
